name: Real-sample regression

# Runs the GPS5 SCAL regression (tests/test_real_sample.py) against a real
# GoPro file. The sample is not vendored; it is fetched from a pinned
# gpmf-parser commit and checksum-verified, then cached. Kept in its own
# workflow so it does not depend on (or collide with) the main lint/test CI.
# The "Verify sample" step is a hard guard: the test file self-skips when
# the sample is absent, so without it a cache miss/empty cache would leave
# the GPS5 regression un-run on a green check.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: pip/uv install from PyPI, so a compromised dependency
# must never inherit a repo-writing GITHUB_TOKEN on PRs.
permissions:
  contents: read

env:
  SAMPLE_SHA256: 8e8fa98887f86119be1b886762b1080a92afb6cc146db719a238bdcba908277b

jobs:
  real-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install package and dev tools (locked)
        run: uv sync --frozen

      - name: Cache GoPro sample
        id: cache-sample
        uses: actions/cache@v4
        with:
          path: sample/max-heromode.mp4
          # Key pins both the source commit and the expected checksum, so any
          # change to either fetches fresh.
          key: gopro-sample-e40f6d9d-8e8fa988

      - name: Download GoPro sample (pinned commit, checksum-verified)
        if: steps.cache-sample.outputs.cache-hit != 'true'
        run: |
          mkdir -p sample
          curl -sSL --retry 3 -o sample/max-heromode.mp4 \
            https://raw.githubusercontent.com/gopro/gpmf-parser/e40f6d9d3d7d17c9641c26d60e56d2927151d490/samples/max-heromode.mp4
          echo "$SAMPLE_SHA256  sample/max-heromode.mp4" | sha256sum -c -

      - name: Verify sample (hard guard - exists, non-empty, checksum)
        run: |
          test -s sample/max-heromode.mp4
          echo "$SAMPLE_SHA256  sample/max-heromode.mp4" | sha256sum -c -

      - name: Run real-sample regression test
        env:
          TELEMETRIK_SAMPLE: ${{ github.workspace }}/sample/max-heromode.mp4
        run: uv run pytest tests/test_real_sample.py -v
