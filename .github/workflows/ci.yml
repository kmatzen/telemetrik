name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: dev deps come from PyPI via uv.lock, so a compromised
# dependency must never inherit a repo-writing GITHUB_TOKEN on PRs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package and dev tools (locked)
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Smoke test
        run: uv run python -c "from telemetrik import extract_all_telemetry, TelemetryStream, __version__; print(f'telemetrik {__version__} OK')"

      - name: Test
        run: uv run python -m pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install package and dev tools (locked)
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/telemetrik
