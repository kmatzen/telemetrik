name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Smoke test
        run: python -c "from telemetrik import extract_all_telemetry, TelemetryStream, __version__; print(f'telemetrik {__version__} OK')"

      - name: Run tests
        run: pytest --cov=telemetrik --cov-report=term-missing
