[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetrik"
dynamic = ["version"]
description = "Extract GPS, gyro, accelerometer, and other telemetry from GoPro video files. Pure Python, zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Kevin Blackburn-Matzen" },
]
keywords = [
    "gopro",
    "gpmf",
    "telemetry",
    "gps",
    "imu",
    "gyroscope",
    "accelerometer",
    "action-camera",
    "metadata",
    "video",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kmatzen/telemetrik"
Repository = "https://github.com/kmatzen/telemetrik"
Issues = "https://github.com/kmatzen/telemetrik/issues"
Changelog = "https://github.com/kmatzen/telemetrik/blob/main/CHANGELOG.md"

[project.scripts]
telemetrik = "telemetrik.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetrik"]

[tool.hatch.version]
path = "src/telemetrik/__init__.py"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
